<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis · Model test</title>
<meta name="theme-color" content="#02060c">
<style>
  :root { --bg:#02060c; --panel:#041422; --line:#3fe0ff33; --cyan:#3fe0ff; --text:#cfefff; --dim:#7fa3b5; --ok:#4dffa6; --bad:#ff4d5e; --warn:#ffb547; }
  * { box-sizing: border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 0,#06223a,var(--bg) 60%); color:var(--text); font:15px/1.45 system-ui,sans-serif; padding:16px; min-height:100vh; }
  h1 { margin:0 0 4px; color:var(--cyan); letter-spacing:.25em; font-size:18px; text-shadow:0 0 12px #3fe0ff88; }
  .sub { color:var(--dim); margin:0 0 16px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  button { font:600 13px system-ui; letter-spacing:.12em; padding:12px 18px; background:transparent; color:var(--cyan); border:1px solid var(--cyan); cursor:pointer; }
  button.primary { background:var(--cyan); color:#001018; }
  button:disabled { opacity:.4; cursor:default; }
  .chip { border:1px solid var(--line); padding:6px 10px; color:var(--dim); font-size:13px; }
  .chip b { color:var(--text); font-weight:600; }
  .progress { height:4px; background:var(--panel); margin:0 0 16px; }
  .progress i { display:block; height:100%; width:0; background:var(--cyan); transition:width .3s; }
  .card { background:var(--panel); border:1px solid var(--line); padding:14px; margin-bottom:10px; }
  .card.top { border-color:var(--cyan); }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .name { font-weight:700; font-size:16px; }
  .id { color:var(--dim); font-size:12px; word-break:break-all; }
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:12px 0 8px; }
  .stat small { display:block; color:var(--dim); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .stat span { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
  .good { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--dim); font-size:13px; }
  .miss { margin:8px 0 0; padding-left:10px; border-left:2px solid var(--bad); font-size:13px; }
  .miss q { display:block; color:var(--dim); margin-top:2px; }
  .use { margin-top:10px; padding:8px 12px; }
  a { color:var(--cyan); }
  @media (max-width:520px) { .stats { grid-template-columns:repeat(2,minmax(0,1fr)); } }
</style>
</head>
<body>
<h1>MODEL TEST</h1>
<p class="sub">20 real Jarvis requests plus one live web search, run on each candidate model. Pick on accuracy first, then speed, then cost. <a href="/">Back to Jarvis</a></p>

<div class="bar">
  <button class="primary" id="run">RUN TEST</button>
  <span class="chip">Talk model now: <b id="current">…</b></span>
  <span class="chip">Max test cost: <b id="budget">…</b></span>
</div>
<div class="progress"><i id="pbar"></i></div>
<p class="sub" id="status"></p>
<div id="results"></div>

<script>
const $ = id => document.getElementById(id);
const money = (v, d = 2) => '$' + Number(v || 0).toFixed(d);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
let timer = null;

function render(d) {
  $('current').textContent = d.current || '—';
  $('budget').textContent = money(d.budget);
  $('run').disabled = d.running;
  const p = d.progress;
  $('pbar').style.width = d.running && p?.total ? (100 * p.done / p.total) + '%' : d.report ? '100%' : '0';
  $('status').innerHTML = d.error ? `<span class="bad">${esc(d.error)}</span>`
    : d.running ? `Testing… ${p?.done || 0} of ${p?.total || '?'} requests · spent ${money(p?.spent, 3)}. Takes a few minutes; you can leave this page.`
    : d.report ? `Last run ${new Date(d.report.finished).toLocaleString()} · spent ${money(d.report.spent, 3)}${d.report.stoppedForBudget ? ' · <span class="warn">stopped at the cost cap, results partial</span>' : ''}`
    : 'No test run yet.';
  const models = d.report?.models || [];
  $('results').innerHTML = models.map((m, i) => {
    if (m.missing) return `<div class="card"><div class="name">${esc(m.label)}</div><div class="id">Not available on OpenRouter right now.</div></div>`;
    const s = m.summary || {};
    const pct = s.of ? s.passed / s.of : 0;
    const misses = (m.cases || []).filter(c => !c.pass);
    return `<div class="card ${i === 0 ? 'top' : ''}">
      <div class="row"><div><div class="name">${i === 0 ? '★ ' : ''}${esc(m.label)}</div><div class="id">${esc(m.id)} · list price ${money(m.price?.in)} in / ${money(m.price?.out)} out per million tokens</div></div></div>
      <div class="stats">
        <div class="stat"><small>Passed</small><span class="${pct >= .9 ? 'good' : pct >= .75 ? 'warn' : 'bad'}">${s.passed}/${s.of}</span></div>
        <div class="stat"><small>Median reply</small><span>${(s.medianMs / 1000).toFixed(1)}s</span></div>
        <div class="stat"><small>Per question</small><span>${money(s.costPerQuestion, 4)}</span></div>
        <div class="stat"><small>100 a day, month</small><span>${money(s.monthlyAt100PerDay)}</span></div>
      </div>
      <div class="id">Slowest ${(s.slowestMs / 1000).toFixed(1)}s · live web search ${s.liveSearch ? '<span class="good">worked</span>' : '<span class="bad">failed</span>'}</div>
      ${misses.length ? `<details><summary>What it got wrong (${misses.length})</summary>${misses.map(c => `<div class="miss"><b>${esc(c.id)}</b>: ${esc(c.why)}<q>${esc(c.text || '(no reply)')}</q></div>`).join('')}</details>` : ''}
      <button class="use" data-id="${esc(m.id)}" ${m.id === d.current ? 'disabled' : ''}>${m.id === d.current ? 'IN USE' : 'USE THIS MODEL'}</button>
    </div>`;
  }).join('');
}

async function refresh() {
  const d = await (await fetch('/api/bench')).json();
  render(d);
  clearTimeout(timer);
  if (d.running) timer = setTimeout(refresh, 2500);
}
$('run').onclick = async () => {
  if (!confirm('Run the model test? It costs at most the amount shown, usually far less.')) return;
  const r = await fetch('/api/bench', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  const d = await r.json();
  if (!r.ok) { $('status').innerHTML = `<span class="bad">${esc(d.error)}</span>`; return; }
  refresh();
};
$('results').onclick = async e => {
  const id = e.target.dataset?.id;
  if (!id) return;
  const r = await fetch('/api/talk-model', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
  if (r.ok) refresh();
};
refresh();
</script>
</body>
</html>
