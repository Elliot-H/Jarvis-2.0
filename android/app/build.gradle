plugins { id 'com.android.application' }

def runNo = Integer.parseInt(System.getenv('RUN_NUMBER') ?: '1')

android {
  namespace 'app.jarvis'
  compileSdk 34
  defaultConfig {
    applicationId 'app.jarvis.hud'
    minSdk 28
    targetSdk 34
    versionCode runNo
    versionName "1.0.${runNo}"
    // Where the Jarvis server lives. Change here (or override with -PjarvisUrl=...) if the Railway address changes.
    buildConfigField 'String', 'BASE_URL', '"' + (project.findProperty('jarvisUrl') ?: 'https://jarvis-20-production-da28.up.railway.app') + '"'
  }
  buildFeatures { buildConfig true }
  androidResources { noCompress 'tflite' }
  signingConfigs {
    release {
      // Personal side-loaded app: the key is committed so every build has the same signature and updates install over the old one.
      storeFile file('../jarvis.keystore')
      storePassword 'jarvis-hud'
      keyAlias 'jarvis'
      keyPassword 'jarvis-hud'
    }
  }
  buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
  implementation 'org.tensorflow:tensorflow-lite:2.14.0'
}
