name: Build Android app
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: set -o pipefail; gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: echo "::error::$(grep -E 'error:|wrong|FAILED|Exception|Caused by|not found|Could not|build.gradle|jarvis' build.log | head -30 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
      - run: cp android/app/build/outputs/apk/release/app-release.apk jarvis.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Jarvis app ${{ github.run_number }}
          files: jarvis.apk
          make_latest: true
