name: Build Android app
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk jarvis.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Jarvis app ${{ github.run_number }}
          files: jarvis.apk
          make_latest: true
